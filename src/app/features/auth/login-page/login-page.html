<div class="login-screen">
  <div class="login-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
    </div>
    <h1 class="login-title">Distribuidora<br /><span>Urbani</span></h1>
    <p class="login-subtitle">Ingresa para continuar</p>
  </div>

  <div class="login-card" [formGroup]="form" (keydown.enter)="submit()">
    <div class="field-group">
      <label>Usuario</label>
      <div
        class="input-wrap"
        [class.error]="form.get('username')?.invalid && form.get('username')?.touched"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <input
          type="text"
          formControlName="username"
          placeholder="Tu usuario"
          autocomplete="username"
        />
      </div>
      <span
        class="field-error"
        *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
      >
        Ingresa un usuario válido
      </span>
    </div>

    <div class="field-group">
      <label>Contraseña</label>
      <div
        class="input-wrap"
        [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input
          type="password"
          formControlName="password"
          placeholder="Tu contraseña"
          autocomplete="current-password"
        />
      </div>
      <span
        class="field-error"
        *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
      >
        Ingresa una contraseña válida
      </span>
    </div>

    <div class="login-error" *ngIf="errorMsg()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      {{ errorMsg() }}
    </div>

    <button class="btn-login" (click)="submit()" [disabled]="form.invalid">Ingresar</button>
  </div>
</div>
